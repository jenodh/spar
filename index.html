<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- HEADER -->

    <!-- Top banner -->
    <header class="site-header">
      <div class="top-banner">
        <nav>
          <a href="#">Säkra din plats</a>
          <a href="#">Event</a>
          <a href="#">Spår limited edition</a>
        </nav>
      </div>

      <!-- Navigation -->
      <div class="main-header">
        <!-- Logo -->
        <a href="/index.html" class="logo">Logo</a>

        <!-- Desktop navigation -->
        <nav class="desktop-nav">
          <a href="#">Ytterkläder</a>
          <a href="#">Överdelar</a>
          <a href="#">Underdelar</a>
          <a href="#">Skor</a>
          <a href="#">Accessories</a>
        </nav>

        <!-- Desktop search and actions -->
        <div class="desktop-tools">
          <form action="" class="desktop-search" role="search">
            <input type="search" placeholder="Sök" />
          </form>
          <button type="button">Login</button>
          <button type="button">Varukorg</button>
        </div>

        <!-- Mobile actions -->
        <div class="mobile-actions">
          <button type="button">Sök</button>
          <button type="button">Varukorg</button>
          <button type="button">Meny</button>
        </div>
      </div>
    </header>

    <!-- MAIN CONTENT -->
    <main>
      <!-- Hero section -->
      <section class="hero">
        <div class="hero-image"></div>
        <div class="hero-content">
          <h1>Vinterkollektion</h1>
          <p>Begränsad upplaga</p>
          <a href="#" class="button">Visa kollektion</a>
        </div>
      </section>

      <!-- Product section -->
      <section class="product-section">
        <div class="section-header">
          <h2>Nyinkommet</h2>
        </div>

        <div class="product-grid">
          <article class="product-card">
            <a href="#" class="product-link">
              <div class="product-image"></div>
              <div class="product-info">
                <h3>Product title</h3>
                <p class="product-price">1499 kr</p>
              </div>
            </a>
          </article>

          <article class="product-card">
            <a href="#" class="product-link">
              <div class="product-image"></div>
              <div class="product-info">
                <h3>Product title</h3>
                <p class="product-price">1499 kr</p>
              </div>
            </a>
          </article>
        </div>

        <div class="carousel-controls">
          <button type="button">&lt;</button>
          <button type="button">&gt;</button>
        </div>
      </section>
    </main>
  </body>
</html>
